app-id: io.github.dlna_server.DlnaVideoServer2
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: dlna-app
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --filesystem=/mnt:ro
  - --filesystem=/media:ro
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.ScreenSaver
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '24.08'
    add-ld-path: .
modules:
  - name: dlna-video-server-2
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/ffmpeg
      - install -Dm755 target/release/dlna-app /app/bin/dlna-app
      - install -Dm644 crates/ui/assets/brand_256.png /app/share/icons/hicolor/256x256/apps/io.github.dlna_server.DlnaVideoServer2.png
      - install -Dm644 crates/ui/assets/brand_128.png /app/share/icons/hicolor/128x128/apps/io.github.dlna_server.DlnaVideoServer2.png
      - install -Dm644 crates/ui/assets/brand_48.png /app/share/icons/hicolor/48x48/apps/io.github.dlna_server.DlnaVideoServer2.png
      - install -Dm644 crates/ui/assets/logo_tv.png /app/share/dlna-server/assets/logo_tv.png
      - install -Dm644 packaging/flatpak/io.github.dlna_server.DlnaVideoServer2.desktop /app/share/applications/io.github.dlna_server.DlnaVideoServer2.desktop
    sources:
      - type: dir
        path: ../..
