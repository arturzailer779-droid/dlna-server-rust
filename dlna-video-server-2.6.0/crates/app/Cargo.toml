[package]
name = "dlna-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
slint = { version = "1.19", features = ["backend-winit", "unstable-winit-030"] }
rfd = "0.15"
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
pollster = "0.4"
tokio = { version = "1", features = ["rt", "time", "macros"] }
image = { version = "0.25", default-features = false, features = ["png"] }
dlna-core = { path = "../core" }
dlna-config = { path = "../config" }
dlna-diagnostics = { path = "../diagnostics" }
dlna-media-library = { path = "../media-library" }
dlna-network = { path = "../network" }
dlna-platform = { path = "../platform" }
dlna-protocol = { path = "../dlna" }
dlna-streaming = { path = "../streaming" }
dlna-transcoding = { path = "../transcoding" }
dlna-ui = { path = "../ui" }
