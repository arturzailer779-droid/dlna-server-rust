[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/core",
    "crates/config",
    "crates/diagnostics",
    "crates/media-library",
    "crates/network",
    "crates/dlna",
    "crates/streaming",
    "crates/client-compatibility",
    "crates/transcoding",
    "crates/platform",
    "crates/ui",
]

[workspace.package]
version = "2.6.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
strip = true
